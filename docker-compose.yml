# Local dev stack: a client-like MySQL (loans/txns) + the app-owned schema live
# on the same server. Seed data is FAKE only (never real customer data).
#
# On first start, everything in apps/api/src/db/seed/ runs in filename order and creates:
#   client_db  + user app_ro (SELECT only)   — mirrors the client's read-only DB
#   mobile_app + user app_rw (full DML)       — the app-owned schema
#
# Run from WSL (Docker lives in WSL, not Docker Desktop):
#   docker compose up -d        # start in the background
#   docker compose logs -f mysql
#   docker compose down         # stop (keeps data in ./docker-data)
#   docker compose down -v && rm -rf docker-data   # full reset (re-runs the seed)
services:
  mysql:
    image: mysql:8.4
    container_name: loanapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: devroot
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      - ./apps/api/src/db/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdevroot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTE: port 3306 is exposed to the host for LOCAL DEV ONLY.
    # In staging/production MySQL is never reachable from the public internet (PRD 6.3).
