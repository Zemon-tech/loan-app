# OpenAPI contract — SINGLE SOURCE OF TRUTH for the Borrower API (task FR-1).
#
# WIRE contract only. These schemas describe exactly what travels on the wire per
# docs/api-guide.md: camelCase, rupee-decimal `number` amounts (Indian rupees, up to 2
# decimals), ISO-8601 `string` datetimes. The mobile client has a thin adapter boundary
# (apps/mobile/src/features/api/adapter.ts) that bridges these wire shapes into the app's
# internal @app/shared DOMAIN types (integer paise, IST `YYYY-MM-DD`, uppercase LoanStatus).
# The @app/shared domain types are DELIBERATELY DISTINCT from these wire shapes and are NOT
# changed by this contract. `loanRef` is OPAQUE: never parsed, never stored across logins.
#
# Where this guide conflicts with shared/src/types/api.ts, the GUIDE WINS for the wire
# contract (docs/DECISIONS.md D-GUIDE-WINS). Clients classify responses by HTTP STATUS CODE,
# not by body shape (the `{"error":"code"}` vs missing-token `{"message":"..."}` difference
# must not drive parsing).
#
# Contract-first: change this file BEFORE endpoints/client code (AGENTS.md working rule 2).
openapi: 3.1.0
info:
  title: Borrower API
  version: 1.0.0
  description: >
    Read-only customer loan tracker. Borrowers log in with a mobile OTP (plus an optional
    date-of-birth second step) and view their loans. No payment, loan-application, or
    marketing endpoints exist in any phase (PRD scope guard, Section 0 rule 11). HTTPS only;
    the API needs no API key (nothing in the app is secret).
servers:
  - url: https://online.alangcredits.com
    description: Origin only. Every path below carries the full /api/v1 prefix.

tags:
  - name: auth
  - name: loans
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness check (public)
      security: []
      responses:
        '200':
          description: OK

  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Request an OTP for a mobile number
      description: >
        Sends a 6-digit OTP on WhatsApp (valid 5 minutes, usable once). The reply is the same
        whether or not the number is registered — never reveal registration status. Limits:
        one request per number every 60 seconds, three per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestBody'
      responses:
        '202':
          description: Accepted. Show the neutral "if registered, you'll receive a code" copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestAccepted'
        '400':
          description: Invalid mobile number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Too many requests. Wait; do not auto-retry in a loop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP (and optional date of birth)
      description: >
        On `date_of_birth_required`, ask for the date of birth and repeat with the same OTP
        plus `dateOfBirth`. Three wrong attempts lock the number for 15 minutes; during the
        lock even a correct OTP returns `invalid_otp`. Show ONE message for all 401 cases.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyBody'
      responses:
        '200':
          description: >
            Either `authenticated` (tokens issued) or `date_of_birth_required` (no tokens yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: >
            Wrong, expired or already-used OTP, wrong date of birth, or the number is locked.
            Body is `{"error":"invalid_otp"}`. Surface ONE non-revealing message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for new tokens
      description: >
        Each refresh token works once — SAVE THE NEW ONE BEFORE USING THE NEW ACCESS TOKEN.
        Sending an old refresh token ends the session immediately. The client MUST guarantee
        two refresh calls can never run at once (single-flight lock in the network layer).
        Refresh tokens last 30 days from last use; a session lasts at most 90 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshBody'
      responses:
        '200':
          description: New tokens (same body as a successful verify).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '401':
          description: >
            Refresh rejected (old/unknown token). End the session: delete both tokens and
            return to login.
          headers:
            Token-Expired:
              $ref: '#/components/headers/TokenExpired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out the current session
      description: Requires a bearer access token. Delete both tokens afterwards.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /api/v1/loans:
    get:
      tags: [loans]
      summary: List the borrower's loans
      description: Requires a bearer access token. Limited to 60 requests/minute per session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The borrower's loans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoansResponseWire'
        '401':
          description: >
            Not logged in. If the header `Token-Expired: true` is present, refresh and retry
            once; otherwise return to login. A missing-token 401 has body `{"message":"..."}`
            (rely on the status code, not the body shape).
          headers:
            Token-Expired:
              $ref: '#/components/headers/TokenExpired'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBody'
                  - $ref: '#/components/schemas/MissingTokenBody'
        '429':
          description: Too many requests. Wait; do not auto-retry in a loop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error. Show a generic message and retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/v1/loans/{loanRef}:
    get:
      tags: [loans]
      summary: Get one loan's detail
      description: >
        Requires a bearer access token. `loanRef` is an OPAQUE value from the list call — do
        not parse it or store it across logins. A loan that doesn't exist, isn't active, or
        belongs to someone else returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: loanRef
          in: path
          required: true
          description: Opaque loan reference from GET /api/v1/loans. Never parsed by the client.
          schema:
            type: string
      responses:
        '200':
          description: The loan detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetailWire'
        '401':
          description: >
            Not logged in. Refresh-and-retry-once if `Token-Expired: true`, else return to login.
          headers:
            Token-Expired:
              $ref: '#/components/headers/TokenExpired'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorBody'
                  - $ref: '#/components/schemas/MissingTokenBody'
        '404':
          description: Loan not found. Show "loan not found" and reload the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Access token from verify/refresh, sent as `Authorization: Bearer <accessToken>`.'

  headers:
    TokenExpired:
      description: >
        Present and set to `true` on a 401 when the access token has expired. The client runs a
        single-flight refresh and retries the original request exactly once.
      schema:
        type: string
        enum: ['true']

  schemas:
    OtpRequestBody:
      type: object
      required: [mobileNumber]
      properties:
        mobileNumber:
          type: string
          description: Bare 10-digit Indian mobile number (no +91 prefix).
          example: '9876543210'

    OtpRequestAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [otp_sent_if_registered]

    OtpVerifyBody:
      type: object
      required: [mobileNumber, otp, deviceId]
      properties:
        mobileNumber:
          type: string
          example: '9876543210'
        otp:
          type: string
          description: 6-digit one-time password.
          example: '123456'
        deviceId:
          type: string
          minLength: 8
          maxLength: 100
          description: Random per-install id (never a hardware identifier).
        dateOfBirth:
          type: string
          format: date
          description: yyyy-MM-dd. Only sent when the API responded `date_of_birth_required`.
          example: '1990-05-21'

    AuthSuccess:
      type: object
      required: [status, accessToken, expiresInSeconds, refreshToken]
      properties:
        status:
          type: string
          enum: [authenticated]
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          description: >
            Advisory only. The client does NOT use this to drive a proactive refresh — the sole
            refresh trigger is a 401 carrying `Token-Expired: true`.
          example: 900
        refreshToken:
          type: string

    DobRequired:
      type: object
      required: [status, expiresInSeconds]
      properties:
        status:
          type: string
          enum: [date_of_birth_required]
        expiresInSeconds:
          type: integer
          description: Always 0 here — no tokens were issued. Ignored by the client.
          enum: [0]

    OtpVerifyResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthSuccess'
        - $ref: '#/components/schemas/DobRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/AuthSuccess'
          date_of_birth_required: '#/components/schemas/DobRequired'

    RefreshBody:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
          minLength: 8
          maxLength: 100

    LogoutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [logged_out]

    LoanWire:
      type: object
      description: A loan as returned in the list. Amounts are Indian rupees (up to 2 decimals).
      required:
        [loanRef, accountNumber, status, installmentAmount, outstandingAmount, overdueAmount]
      properties:
        loanRef:
          type: string
          description: Opaque reference. Never parsed or persisted across logins.
          example: x7Kq2mVbT9sLw3RnYc1DfA
        accountNumber:
          type: string
          example: LN-1042
        status:
          type: string
          description: >
            Title-case label (e.g. "Active", "Overdue", "Closed"). The client normalizes
            case-insensitively to its domain enum with a safe fallback; the vocabulary may
            exceed these examples.
          example: Active
        installmentAmount:
          type: number
          example: 500.00
        outstandingAmount:
          type: number
          example: 18250.00
        overdueAmount:
          type: number
          example: 1000.00

    LoanDetailWire:
      allOf:
        - $ref: '#/components/schemas/LoanWire'
        - type: object
          required:
            [startDate, maturityDate, paymentFrequency, financedAmount, totalPaid]
          properties:
            startDate:
              type: string
              description: ISO-8601 datetime, documented as zoneless (e.g. 2026-04-01T00:00:00).
              example: '2026-04-01T00:00:00'
            maturityDate:
              type: string
              example: '2026-10-31T00:00:00'
            paymentFrequency:
              type: string
              description: >
                e.g. "Daily"/"Weekly"/"Fortnightly"/"Monthly". Normalized case-insensitively;
                unknown values render as a neutral dash.
              example: Daily
            financedAmount:
              type: number
              example: 50000.00
            totalPaid:
              type: number
              example: 37500.00

    LoansResponseWire:
      type: object
      required: [loans]
      properties:
        loans:
          type: array
          items:
            $ref: '#/components/schemas/LoanWire'

    ErrorBody:
      type: object
      description: >
        Standard error body `{"error":"code"}`. The `code` is for the client's internal
        decisioning only and is NEVER shown to the user. Classify by HTTP status, not this body.
      required: [error]
      properties:
        error:
          type: string
          example: invalid_otp

    MissingTokenBody:
      type: object
      description: >
        A 401 for a MISSING token uses `{"message":"..."}` instead of `{"error":...}`. Rely on
        the status code, not the body shape.
      required: [message]
      properties:
        message:
          type: string
